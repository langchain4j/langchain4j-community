# Diagnostic probe for the org Actions policy: third-party action, pinned.
# This file is temporary and will be removed once the policy issue is diagnosed.
name: Probe mikepenz Action
on: pull_request
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6
        with:
          report_paths: '**/target/*-reports/TEST-*.xml'
          annotate_only: true