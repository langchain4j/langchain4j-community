name: Java CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.gitignore'
      - '*.md'
      - 'LICENSE'
      - '.github/*.md'
      - '.github/*.yaml'
      - '.github/ISSUE_TEMPLATE/*.md'
  pull_request:
    paths-ignore:
      - '.gitignore'
      - '*.md'
      - 'LICENSE'
      - '.github/*.md'
      - '.github/*.yaml'
      - '.github/ISSUE_TEMPLATE/*.md'

jobs:
  java_build:
    runs-on: ubuntu-latest
    needs:
      - spotless
      - compliance
    continue-on-error: ${{ !matrix.integration_tests }}
    strategy:
      fail-fast: false
      matrix:
        java_version:
          - 17
          - 21
          - 25
        include:
          - java_version: 17
            mvn_opts: ''
            integration_tests: false
          - java_version: 21
            mvn_opts: ''
            # Only run integration tests on JDK21 to save time and cost.
            integration_tests: true
          - java_version: 25
            mvn_opts: ''
            integration_tests: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Create branch from commit by event name
        run: |
          if [[ '${{ github.event_name }}' == 'push' ]]; then
            git branch __branch_before ${{ github.event.before }}
          elif [[ "${{ github.event_name }}" == 'pull_request' ]]; then
            git branch __branch_before ${{ github.event.pull_request.base.sha }}
          fi
      - name: Set up JDK ${{ matrix.java_version }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: ${{ matrix.java_version }}
          distribution: 'temurin'
          cache: 'maven'
      - name: Compile and test with JDK ${{ matrix.java_version }}
        run: |
          mvn -B -U -T8C test javadoc:aggregate \
            ${{ matrix.mvn_opts }}

      - name: Integration test with JDK ${{ matrix.java_version }}
        ## The step or job will only run if the `integration_tests` variable is true
        ## in the matrix is false (not set to true)
        if: ${{ matrix.integration_tests == true }}
        run: |
          mvn -B -U verify \
            -DskipXinferenceITs \
            -DskipSearXNGITs \
            -DskipVearchITs \
            -DskipLanceDbITs=false \
            -Dgib.disable=false -Dgib.referenceBranch=__branch_before \
            ${{ matrix.mvn_opts }}

      - name: Publish test summary
        if: always()
        env:
          SUMMARY_TITLE: 'Test Results (JDK ${{ matrix.java_version }})'
        run: |
          python3 << 'PYEOF'
          import xml.etree.ElementTree as ET
          import glob, os, re

          files = glob.glob('**/target/*-reports/TEST-*.xml', recursive=True)
          if not files:
              raise SystemExit(0)  # e.g. compilation failed before any test ran

          total = failures = errors = skipped = 0
          failed_tests = []

          for path in files:
              try:
                  root = ET.parse(path).getroot()
                  total += int(root.get('tests', 0))
                  failures += int(root.get('failures', 0))
                  errors += int(root.get('errors', 0))
                  skipped += int(root.get('skipped', 0))
                  for tc in root.findall('.//testcase'):
                      fail = tc.find('failure')
                      if fail is None:
                          fail = tc.find('error')
                      if fail is not None:
                          cls = tc.get('classname', '')
                          name = tc.get('name', '')
                          trace = fail.text or ''
                          m = re.search(r'\bat ' + re.escape(cls) + r'[.$][^\n(]*\(([^)]+\.java:\d+)\)', trace)
                          loc = f'`{m.group(1)}`' if m else ''
                          msg = (fail.get('message', '') or '').replace('\n', '<br>').replace('|', '\\|')
                          if len(msg) > 500:
                              msg = f"{msg[:500]}<details><summary>show more</summary>{msg[500:]}</details>"
                          failed_tests.append(f"| `{cls}` | `{name}` | {loc} | {msg} |")
              except Exception:
                  pass

          passed = total - failures - errors - skipped
          title = os.environ.get('SUMMARY_TITLE', 'Test Results')
          summary = os.environ.get('GITHUB_STEP_SUMMARY', '/dev/null')
          with open(summary, 'a') as f:
              f.write(f'## {title}\n\n')
              if failures == 0 and errors == 0:
                  f.write(f':white_check_mark: **{passed} passed**, {skipped} skipped out of {total} tests\n')
              else:
                  f.write(f':x: **{failures} failed, {errors} errors**, {passed} passed, {skipped} skipped out of {total} tests\n')
              if failed_tests:
                  f.write('\n### Failures\n\n')
                  f.write('| Class | Test | Location | Error Message |\n')
                  f.write('|-------|------|----------|---------------|\n')
                  for line in failed_tests[:50]:
                      f.write(line + '\n')
                  if len(failed_tests) > 50:
                      f.write(f'\n*... and {len(failed_tests) - 50} more*\n')
          PYEOF

  # For checking some compliance things (require a recent JDK due to plugins so in a separate step)
  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
        # Check we only rely on permissive licenses in the main parts of the library:
      - name: License Compliance
        run: mvn -P compliance org.honton.chas:license-maven-plugin:compliance

  spotless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Spotless Check
        run: mvn -Pspotless validate
